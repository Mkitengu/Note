<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Quick Notebook - Ghi Nhớ & Nhập Số Liệu</title>
  <meta name="description" content="Web notebook thông minh giúp ghi nhớ thông số với nhãn cố định và vùng nhập số linh hoạt.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
  <div class="app-container">
    
    <!-- App Header / Toolbar -->
    <header class="app-header">
      <div class="header-left">
        <button id="btnNewNote" class="icon-btn header-btn" title="Tạo ghi chú mới / Xóa sạch số (Ctrl+N)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <div class="category-selector-wrap">
          <select id="templateSelect" class="template-dropdown" title="Chọn bộ thông số mẫu">
            <!-- Populated dynamically by JS -->
          </select>
        </div>
      </div>

      <div class="header-right">
        <button id="btnClearValues" class="icon-btn header-btn" title="Xóa toàn bộ số đã nhập (giữ nguyên nhãn)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"></path>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
          </svg>
        </button>

        <button id="btnCopyData" class="icon-btn header-btn" title="Sao chép toàn bộ nội dung (để dán vào Excel/Zalo/CAD)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>

        <button id="btnToggleTheme" class="icon-btn header-btn" title="Đổi giao diện Sáng / Tối / Giấy ghi chú">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>

        <button id="btnOpenSettings" class="icon-btn header-btn" title="Cài đặt nhãn & thông số (Sửa text cố định)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Notebook Body -->
    <main class="notebook-content" id="notebookContent">
      <!-- Fixed Label + Input Rows are generated here -->
      <div id="itemsContainer" class="items-list">
        <!-- Rendered dynamically by JS -->
      </div>

      <!-- Freeform Scratchpad Area for extra quick notes -->
      <div class="scratchpad-section">
        <div class="scratchpad-header">
          <span class="scratchpad-label">Ghi chú bổ sung</span>
          <span class="auto-save-tag" id="autoSaveIndicator">Đã lưu ✓</span>
        </div>
        <textarea id="extraNotes" class="scratchpad-input" placeholder="Nhập thêm ghi chú hoặc tính toán tạm thời tại đây..."></textarea>
      </div>
    </main>

    <!-- App Footer / Shortcuts Bar -->
    <footer class="app-footer">
      <div class="status-left">
        <span class="info-pill"><kbd>Enter</kbd> / <kbd>Tab</kbd> : Dòng sau</span>
        <span class="info-pill"><kbd>↑</kbd> <kbd>↓</kbd> : Chuyển dòng</span>
      </div>
      <div class="status-right">
        <span id="activeTemplateBadge" class="template-pill" title="Bộ mẫu đang sử dụng">Mặc định</span>
      </div>
    </footer>

  </div>

  <!-- Settings Modal (Where fixed text can be edited) -->
  <div id="settingsModal" class="modal-backdrop hidden">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-title-group">
          <h2>Cài Đặt Nhãn Cố Định</h2>
          <p class="modal-subtitle">Chỉnh sửa tên nhãn tại đây. Trên giao diện chính, nhãn sẽ được cố định và không sợ bị xóa nhầm.</p>
        </div>
        <button id="btnCloseSettings" class="icon-btn close-btn" title="Đóng (Esc)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <!-- Template Management Section -->
        <div class="settings-section">
          <div class="section-header-row">
            <label class="section-label">Đang chỉnh sửa bộ:</label>
            <div class="template-actions">
              <button id="btnCreateTemplate" class="btn btn-sm btn-secondary" type="button">+ Tạo bộ mới</button>
              <button id="btnDeleteTemplate" class="btn btn-sm btn-danger-outline" type="button" title="Xóa bộ hiện tại">Xóa bộ này</button>
            </div>
          </div>
          
          <div class="template-select-inline-row">
            <select id="modalTemplateSelector" class="form-input modal-template-dropdown" title="Chuyển bộ danh mục để chỉnh sửa">
              <!-- Rendered by JS -->
            </select>
          </div>

          <div class="template-name-input-row">
            <label class="input-sublabel">Đổi tên bộ danh mục:</label>
            <input type="text" id="currentTemplateNameInput" class="form-input" placeholder="Tên bộ nhãn (VD: Kết cấu, Kích thước, Dự toán...)">
          </div>
        </div>

        <!-- Fixed Labels List in Settings -->
        <div class="settings-section">
          <div class="section-header-row">
            <label class="section-label">Danh sách nhãn cố định:</label>
            <span class="hint-text">Thêm, sửa tên hoặc xóa các nhãn</span>
          </div>

          <div id="settingsLabelsList" class="settings-labels-list">
            <!-- Rendered by JS -->
          </div>

          <button id="btnAddLabelRow" class="btn btn-outline-primary btn-block add-row-btn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Thêm nhãn cố định mới
          </button>
        </div>

        <!-- Backup & Quick Preset Section -->
        <div class="settings-section backup-section">
          <label class="section-label">Sao lưu & Dữ liệu mẫu:</label>
          <div class="backup-buttons-row">
            <button id="btnLoadSamplePresets" class="btn btn-sm btn-secondary" type="button" title="Nạp mẫu Beam, Rafter, Joist...">Mẫu Kết Cấu Gỗ/Thép</button>
            <button id="btnExportData" class="btn btn-sm btn-secondary" type="button" title="Tải file sao lưu JSON">Xuất JSON</button>
            <label class="btn btn-sm btn-secondary file-upload-btn" title="Nhập lại file sao lưu JSON">
              Nhập JSON <input type="file" id="importFileInput" accept=".json" style="display:none;">
            </label>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button id="btnCancelSettings" class="btn btn-secondary" type="button">Hủy</button>
        <button id="btnSaveSettings" class="btn btn-primary" type="button">Lưu Thay Đổi</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification with Undo option -->
  <div id="toastNotification" class="toast-popup hidden">
    <span id="toastMessage">Đã thực hiện!</span>
    <button id="btnToastUndo" class="toast-undo-btn hidden" type="button">Hoàn tác</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
